version: "2"

run:
  timeout: 5m

# Baseline relaxed to bug-catching / correctness / security linters.
# Style linters (revive, dupl, gocritic, gocyclo, gocognit, funlen, misspell,
# nolintlint) remain off — re-introduce deliberately if needed.
linters:
  enable:
    # Error handling
    - errcheck
    - errorlint

    # Bug catchers
    - staticcheck
    - govet
    - ineffassign
    - unused

    # Correctness (re-introduced from the dropped set)
    - unconvert
    - unparam

    # Security
    - gosec

  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: "_test\\.go$"
        linters:
          - gosec
          - unparam

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
